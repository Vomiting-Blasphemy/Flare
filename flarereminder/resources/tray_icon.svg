<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#ffe4a8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ff9a3c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- outer halo -->
  <circle cx="32" cy="32" r="30" fill="url(#g)"/>
  <!-- 6 streaks -->
  <g stroke="#ffffff" stroke-linecap="round" stroke-opacity="0.85">
    <line x1="32" y1="2"  x2="32" y2="62" stroke-width="1.4"/>
    <line x1="2"  y1="32" x2="62" y2="32" stroke-width="1.4"/>
    <line x1="9"  y1="9"  x2="55" y2="55" stroke-width="1.0" stroke-opacity="0.7"/>
    <line x1="55" y1="9"  x2="9"  y2="55" stroke-width="1.0" stroke-opacity="0.7"/>
  </g>
  <!-- core -->
  <circle cx="32" cy="32" r="14" fill="url(#core)"/>
  <circle cx="32" cy="32" r="5"  fill="#ffffff"/>
</svg>
